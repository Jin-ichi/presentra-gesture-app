<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesture Presentation Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <button id="close-app" title="Close App">×</button>
      <div class="video-wrapper" id="viz-container">
        <video class="input_video"></video>
        <canvas class="output_canvas" width="320" height="240"></canvas>
      </div>
      <div id="status">READY</div>
      <div id="condition-badge" class="condition-badge hidden"></div>

      <div class="quick-controls">
        <button id="toggle-pointer" class="ctrl-btn" title="Toggle Pointer Mode">Pointer: OFF</button>
        <button data-action="zoom_in" class="ctrl-btn" title="Zoom In">Z+</button>
        <button data-action="zoom_out" class="ctrl-btn" title="Zoom Out">Z-</button>
        <button data-action="media_play_pause" class="ctrl-btn" title="Play/Pause Media">⏯</button>
      </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
